<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1a33">
<title>Götterwettstreit 0.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: full-bleed golden-hour island; HUD kept to two corners and one dock, everything else appears only on tap. Single warm look by choice. */
:root {
  --ink: #12151d;
  --panel: rgba(18, 21, 29, 0.9);
  --panel-2: #1e2230;
  --edge: rgba(214, 166, 72, 0.7);
  --gold: #f2b632;
  --cream: #f6efe2;
  --muted: #b7bccb;
  --teal: #34c46a;
  --pink: #e2475a;
  --danger: #ff6b5a;
  --good: #8fe3a6;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
/* Die Seite selbst bewegt sich nie: kein Gummiband-Scrollen und kein Verschieben auf dem iPhone. */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
body { position: fixed; inset: 0; margin: 0; touch-action: none; background: #0f1a33; color: var(--cream); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(14, 16, 22, 0.78); color: var(--cream); display: flex; align-items: center; gap: 5px; will-change: transform; }
.lbl i { width: 7px; height: 7px; border-radius: 50%; }
.lbl.god { font-family: var(--display); font-size: 11.5px; letter-spacing: 0.04em; background: rgba(14, 16, 22, 0.6); }
.float { position: absolute; left: 0; top: 0; font-family: var(--display); font-weight: 900; font-size: 17px; color: var(--gold); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); white-space: nowrap; will-change: transform, opacity; }
.float small { display: block; font-size: 11px; color: var(--cream); text-align: center; text-shadow: 0 1px 0 #000; }

.hud { position: fixed; top: 0; left: 0; right: 0; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.god { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 14px 5px 5px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); }
.medal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 35%, #c9a04a, #7a5a1e 70%); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 0 10px rgba(242, 182, 50, 0.35); flex-shrink: 0; }
.god .nm { font-family: var(--display); font-weight: 900; font-size: 14px; line-height: 1.1; }
.faith { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.faith .bar { width: 96px; height: 8px; border-radius: 4px; background: #0b0d12; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
.faith .bar i { display: block; height: 100%; width: 64%; background: linear-gradient(90deg, #e9a43a, #ffe08a); border-radius: 4px; transition: width 0.4s ease; }
.faith span { font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 26px; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.res { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); }
.res span { display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 0 3px; }
.mute { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel); color: var(--cream); display: grid; place-items: center; cursor: pointer; }

.pill-btn { appearance: none; border: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; font: 900 12.5px var(--body); cursor: pointer; background: linear-gradient(#a6f0bd, #6fcf8e); color: #0e2a18; box-shadow: 0 3px 0 #2f7a48; }
.pill-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #2f7a48; }
.pill-btn:disabled { background: #3a3f4c; color: #9aa0ae; box-shadow: none; cursor: not-allowed; }

.toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 116px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.toast { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 8px 14px; font-size: 13px; font-weight: 800; max-width: 340px; text-align: center; animation: tin 0.25s ease-out; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
.toast.big { font-family: var(--display); font-size: 15px; border-color: var(--gold); color: var(--gold); }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

.radial { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.rbtn { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; appearance: none; width: 62px; height: 62px; border-radius: 50%; border: 2px solid var(--gold); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--cream); font: 900 10px var(--body); background: radial-gradient(circle at 35% 30%, #4a5164, #1a1e28 72%); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1); animation: pop 0.2s cubic-bezier(.2, .8, .3, 1) both; }
.rbtn svg { width: 24px; height: 24px; }
.rbtn em { font-style: normal; color: var(--gold); font-size: 9.5px; }
.rbtn:disabled { filter: grayscale(0.8) brightness(0.7); cursor: not-allowed; }
.rbtn:active { transform: translate(-50%, -46%); }
@keyframes pop { from { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

.dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 22px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 16px); pointer-events: none; }
.orb { pointer-events: auto; appearance: none; border: 0; background: transparent; color: var(--cream); display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; font: 900 12px var(--body); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
.orb span.ring { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--gold); background: radial-gradient(circle at 35% 30%, #4a5164, #171a23 72%); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
.orb:active span.ring { transform: translateY(3px); box-shadow: 0 2px 0 #07080b, 0 0 0 5px rgba(243, 194, 90, 0.16); }
.orb svg { width: 28px; height: 28px; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 14px); pointer-events: none; z-index: 5; }
.card { pointer-events: auto; max-width: 520px; margin: 0 auto; background: linear-gradient(#262b38, #14171f); border: 1px solid var(--edge); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08); animation: up 0.22s ease-out; max-height: 62vh; overflow-y: auto; }
@keyframes up { from { transform: translateY(24px); opacity: 0.3; } to { transform: none; opacity: 1; } }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-head h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 900; color: var(--cream); text-wrap: balance; }
.card-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.x { appearance: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--edge); background: transparent; color: var(--cream); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #0b0d12; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
.split i { display: block; height: 100%; transition: width 0.5s ease; }
.legend { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 10px; }
.row .ill { width: 64px; height: 64px; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #3e4558, #14171f); display: grid; place-items: center; flex-shrink: 0; }
.row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .t { font-family: var(--display); font-weight: 900; font-size: 14.5px; }
.row .d { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.35; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-size: 11.5px; font-weight: 900; padding: 2px 8px; border-radius: 8px; background: rgba(143, 227, 166, 0.14); color: var(--good); }
.chip.miss { background: rgba(255, 107, 90, 0.14); color: #ffab9e; }
.gold-btn { appearance: none; border: 0; min-height: 44px; padding: 0 16px; border-radius: 13px; font: 900 13.5px var(--body); cursor: pointer; color: #3a2408; background: linear-gradient(#ffe08a, #e9a43a); box-shadow: 0 4px 0 #8a5a14; flex-shrink: 0; }
.gold-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a5a14; }
.gold-btn:disabled { background: #3a3f4c; color: #9aa0ae; box-shadow: none; cursor: not-allowed; }
.rank { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 13.5px; }
.rank .pos { font-family: var(--display); font-size: 18px; width: 22px; color: var(--gold); }
.rank .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rank .mini { height: 7px; border-radius: 4px; background: #0b0d12; overflow: hidden; }
.rank .mini i { display: block; height: 100%; border-radius: 4px; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.lobby { position: fixed; inset: 0; z-index: 20; overscroll-behavior: contain; touch-action: pan-y; overflow-x: hidden; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(ellipse at 50% 40%, rgba(10, 12, 20, 0.35), rgba(10, 12, 20, 0.82)); overflow-y: auto; }
.lcard { width: 100%; max-width: 400px; background: linear-gradient(#262b38, #14171f); border: 1px solid var(--edge); border-radius: 22px; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55); }
.lcard h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 26px; color: var(--gold); text-align: center; letter-spacing: 0.03em; }
.lcard .sub { margin: -4px 0 4px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.lcard label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 800; color: var(--muted); }
.lcard input { appearance: none; border: 1px solid rgba(243, 194, 90, 0.45); background: #0f1219; color: var(--cream); border-radius: 12px; min-height: 46px; padding: 0 12px; font: 800 16px var(--body); }
.lcard input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.gods { display: flex; flex-direction: column; gap: 8px; }
.gpick { appearance: none; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04); color: var(--cream); font: 800 14px var(--body); text-align: left; cursor: pointer; }
.gpick i { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.gpick small { margin-left: auto; color: var(--muted); font-size: 12px; }
.gpick[aria-pressed="true"] { border-color: var(--gold); background: rgba(243, 194, 90, 0.12); }
.gpick:disabled { opacity: 0.45; cursor: not-allowed; }
.lcard .alt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; font-weight: 800; color: var(--muted); border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 12px; }
.lcard .alt span { flex-basis: 100%; }
.lcard .alt input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: 0.15em; }
.lcard .err { margin: 0; min-height: 1em; color: #ffab9e; font-size: 13px; font-weight: 800; text-align: center; }
.mytitle { font-size: 12.5px; font-weight: 800; color: var(--muted); border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 12px; }
button, input { touch-action: manipulation; }
.build { margin: 0; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); opacity: 0.7; }
.linkish { appearance: none; border: 0; background: none; color: var(--muted); font: 800 12.5px var(--body); text-decoration: underline; cursor: pointer; padding: 6px; align-self: center; }
.chron { display: flex; flex-direction: column; gap: 6px; max-height: 38vh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.chron div { display: flex; gap: 8px; align-items: baseline; font-size: 13px; font-weight: 700; line-height: 1.35; }
.chron i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transform: translateY(-1px); }
.chron time { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.invite { display: flex; align-items: center; gap: 10px; background: rgba(255, 243, 220, 0.06); border: 1px dashed rgba(243, 194, 90, 0.45); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 800; }
.invite b { font-family: var(--display); color: var(--gold); letter-spacing: 0.12em; font-size: 16px; }
.invite .gold-btn { margin-left: auto; min-height: 38px; }
h3.sec { margin: 4px 0 0; font-family: var(--display); font-size: 14px; color: var(--cream); }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 14px; color: var(--cream); background: #0f1a33; }
@media (max-width: 380px) { .faith .bar { width: 70px; } .god .nm { font-size: 13px; } }
@media (prefers-reduced-motion: reduce) { .rbtn, .card, .toast { animation: none; } }
</style>
</head>
<body>

<canvas id="scene" tabindex="0" aria-label="3D-Insel. Ziehen zum Drehen, zwei Finger oder Mausrad zum Zoomen, ein Dorf antippen, um ein Wunder zu wirken."></canvas>
<div class="labels" id="labels" aria-hidden="true"></div>
<div class="fallback" id="fallback" hidden>Die 3D-Ansicht konnte nicht geladen werden. Bitte die Seite neu laden.</div>

<div class="hud">
  <div class="god">
    <div class="medal" id="medal" aria-hidden="true"></div>
    <div>
      <div class="nm" id="god-name">&nbsp;</div>
      <div class="faith" aria-label="Glaube"><div class="bar"><i id="faith-bar"></i></div><span id="faith-num">0</span></div>
    </div>
  </div>
  <div class="right">
    <div style="display:flex;gap:6px">
    <button class="mute" id="look" aria-label="Stimmung wechseln"><svg id="look-storm" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15 a4.5 4.5 0 0 1 .5-9 a5.5 5.5 0 0 1 10.3 2 A3.8 3.8 0 0 1 17.5 15"/><path d="M12.5 12 L10 16.5 H13 L11 21" stroke="#f2b632"/></svg><svg id="look-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f2b632" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5 V5 M12 19 V21.5 M2.5 12 H5 M19 12 H21.5 M5.3 5.3 L7 7 M17 17 L18.7 18.7 M5.3 18.7 L7 17 M17 7 L18.7 5.3"/></svg></button>
    <button class="mute" id="mute" aria-label="Ton ausschalten"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z"/><path id="mute-wave" d="M16 9 C17.5 10.5 17.5 13.5 16 15 M19 6.5 C22 9.5 22 14.5 19 17.5" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="radial" id="radial"></div>

<div class="dock" id="dock">
  <button class="orb" id="dock-wunder"><span class="ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L5 14 H11 L9 22 L19 9 H13 Z" fill="#f3c25a"/></svg></span>Wunder</button>
  <button class="orb" id="dock-bauen"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff3dc" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 20 H21 M5 20 V10 L12 5 L19 10 V20 M9.5 20 V14 H14.5 V20"/></svg></span>Bauen</button>
  <button class="orb" id="dock-goetter"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff3dc" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 20 V13 M12 20 V6 M18 20 V10"/></svg></span>Götter</button>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="card" role="dialog" aria-labelledby="card-title"></div></div>
<div class="lobby" id="lobby" hidden>
  <div class="lcard" id="lobby-form">
    <h1>Götterwettstreit</h1>
    <p class="sub" id="lobby-sub"></p>
    <label>Dein Name<input id="lobby-name" maxlength="20" autocomplete="nickname" required></label>
    <div class="gods" id="lobby-gods" role="group" aria-label="Gott wählen"></div>
    <button class="gold-btn" id="lobby-go" type="button"></button>
    <p class="err" id="lobby-err" role="alert"></p>
    <div class="alt" id="lobby-alt"><span>Einen Code bekommen? Hier beitreten:</span><input id="lobby-code" placeholder="Code" maxlength="5" autocapitalize="characters"><button class="pill-btn" id="lobby-codebtn" type="button">Weiter</button></div>
    <button class="linkish" id="lobby-new" type="button" hidden>Stattdessen neues Spiel erstellen</button>
    <div class="gods" id="lobby-games" hidden></div>
    <button class="linkish" id="lobby-back" type="button" hidden>Zurück zum Spiel</button>
    <p class="build" id="lobby-build"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script id="sbjs" async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
// iOS Safari ignoriert maximum-scale beim Zwei-Finger-Zoom. Die Seite selbst soll nie zoomen oder wandern;
// nur die Insel (eigene Gesten) und die Spielauswahl/Chronik (senkrecht scrollen) reagieren auf Wischen.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => {
  if (e.target.id === 'scene') return;
  if (e.touches.length > 1 || !e.target.closest('.lobby, .chron')) e.preventDefault();
}, { passive: false });
</script>
<script>
(function () {
  if (!window.THREE || !THREE.OrbitControls) { document.getElementById('fallback').hidden = false; return; }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COL = { gold: 0xf2b632, teal: 0x34c46a, pink: 0xd8364a, neutral: 0xd8cfc0 };
  const CSSC = { gold: '#f2b632', teal: '#34c46a', pink: '#e2475a', neutral: '#a9b0c2' };
  const BUILD = 'Version 0.2 · Stand 5';
  const GODS = ['gold', 'teal', 'pink'];
  const GOD = { gold: 'Donner', teal: 'Ernte', pink: 'Chaos' };
  const GOD_LONG = { gold: 'Gott des Donners', teal: 'Göttin der Ernte', pink: 'Gott des Chaos' };
  let ME = null; const PLAYERS = {};
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const who = k => k === ME ? 'Du' : esc(PLAYERS[k] || GOD[k]);
  const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
  const whom = k => k === 'neutral' ? 'niemanden' : k === ME ? 'dich' : esc(PLAYERS[k] || '') + ' (' + GOD[k] + ')';

    flags.forEach(f => { const p = f.mesh.geometry.attributes.position, b = f.base; for (let i = 0; i < p.count; i++) { const x = b[i * 3]; p.array[i * 3 + 2] = Math.sin(x * 9 - t * f.speed * 2) * .06 * (x / .56); } p.needsUpdate = true; });
    villagers.forEach(p => {
      p.a += p.sp * dt; const x = p.v.x + Math.cos(p.a) * p.r, z = p.v.z + Math.sin(p.a) * p.r;
      let y = heightAt(x, z) + .02 + Math.abs(Math.sin(t * 8 + p.ph)) * .008;
      if (p.jump > 0) { y += Math.abs(Math.sin(t * 10 + p.ph)) * .14 * Math.min(1, p.jump); p.jump -= dt * .6; }
      p.obj.position.set(x, y, z); p.obj.rotation.y = -p.a - (p.sp > 0 ? 0 : Math.PI);
    });
    if (selRing.visible) { const s = 1 + Math.sin(t * 4) * .04; selRing.scale.set(s, s, 1); }
    // walkers
    for (let i = walkers.length - 1; i >= 0; i--) {
      const w = walkers[i]; w.t += dt / w.dur; const k = Math.min(1, w.t);
      w.curve.getPointAt(k, tv); const ahead = w.curve.getPointAt(Math.min(1, k + .01));
      w.p.position.set(tv.x, heightAt(tv.x, tv.z) + Math.abs(Math.sin(t * 7)) * .06, tv.z); w.p.lookAt(ahead.x, w.p.position.y, ahead.z);
      if (k >= 1) {
        const v = w.toV; sparkleBurst(new THREE.Vector3(v.x, heightAt(v.x, v.z) + .6, v.z), COL[w.owner], 50); cheer(v, 1); if (w.owner === ME) sfx.chime();
        island.remove(w.p); w.lbl.el.remove(); labels.splice(labels.indexOf(w.lbl), 1); walkers.splice(i, 1); w.onArrive && w.onArrive();
      }
    }
    for (let i = effects.length - 1; i >= 0; i--) if (!effects[i](dt)) effects.splice(i, 1);
    // camera focus
    if (focus.t < 1) { focus.t = Math.min(1, focus.t + dt * 1.6); const e = 1 - Math.pow(1 - focus.t, 3); const nt = focus.from.clone().lerp(focus.to, e); const delta = nt.clone().sub(controls.target); controls.target.copy(nt); camera.position.add(delta); }
    controls.update();
    basePos.copy(camera.position);
    if (shake > 0) { camera.position.x += (Math.random() - .5) * shake; camera.position.y += (Math.random() - .5) * shake; shake = Math.max(0, shake - dt * 1.4); }
    renderer.render(scene, camera);
    camera.position.copy(basePos);
    // HTML overlays
    const w = innerWidth, h = innerHeight;
    labels.forEach(l => { l.obj.getWorldPosition(wp); wp.y += l.dy; wp.project(camera); if (wp.z > 1 || Math.abs(wp.x) > 1.1 || Math.abs(wp.y) > 1.1) { l.el.style.display = 'none'; return; } l.el.style.display = ''; l.el.style.transform = 'translate(' + ((wp.x * .5 + .5) * w).toFixed(1) + 'px,' + ((-wp.y * .5 + .5) * h).toFixed(1) + 'px) translate(-50%,-100%)'; });
    for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; wp.copy(f.pos); wp.y += f.t * 1.2; wp.project(camera); f.el.style.transform = 'translate(' + ((wp.x * .5 + .5) * w).toFixed(1) + 'px,' + ((-wp.y * .5 + .5) * h).toFixed(1) + 'px) translate(-50%,-100%) scale(' + (1 + Math.max(0, .3 - f.t) * 1.5).toFixed(2) + ')'; f.el.style.opacity = Math.max(0, 1 - Math.max(0, f.t - 1.1) / .6); if (f.t > 1.7) { f.el.remove(); floats.splice(i, 1); } }
    if (selected && radial.children.length) {
      selected.anchor.getWorldPosition(wp); wp.project(camera); const sx = (wp.x * .5 + .5) * w, sy = (-wp.y * .5 + .5) * h;
      const angles = [-150, -90, -30];
      [...radial.children].forEach((b, i) => { const a = angles[i] * Math.PI / 180, r = 84; let x = sx + Math.cos(a) * r, y = sy + Math.sin(a) * r - 20; x = Math.max(40, Math.min(w - 40, x)); y = Math.max(110, Math.min(h - 260, y)); b.style.left = x + 'px'; b.style.top = y + 'px'; });
    }
    requestAnimationFrame(frame);
  }
  frame();

  // ---------- Spielstand (Supabase) ----------
  const SB_URL = 'https://txtduemylfrhpfklnntg.supabase.co', SB_KEY = 'sb_publishable_vn3LV4Kk2bm3vn-xkXbAgA_AumkhaaP';
  const game = { code: null, token: null, events: [], lastEvent: 0, latest: null, pending: 0, live: null, started: false };
  const VBYID = {}; VILLAGES.forEach(v => VBYID[v.id] = v);
  async function rpc(fn, args, keepalive) {
    let r;
    try { r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', keepalive: !!keepalive, headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) }); }
    catch (e) { throw new Error('Keine Verbindung zu den Göttern. Bitte später noch einmal versuchen.'); }
    const j = r.status === 204 ? null : await r.json().catch(() => null);
    if (!r.ok) throw new Error((j && j.message) || 'Der Himmel schweigt (' + r.status + ').');
    return j;
  }
  const saved = {
    all() { try { return JSON.parse(localStorage.getItem('gw-spiele') || '{}'); } catch (e) { return {}; } },
    put(code, token) { const s = saved.all(); if (token) s[code] = token; else delete s[code]; try { localStorage.setItem('gw-spiele', JSON.stringify(s)); if (token) localStorage.setItem('gw-letztes', code); } catch (e) {} },
    last() { try { return localStorage.getItem('gw-letztes'); } catch (e) { return null; } },
    info() { try { return JSON.parse(localStorage.getItem('gw-spiel-info') || '{}'); } catch (e) { return {}; } },
    putInfo(code, text) { const s = saved.info(); s[code] = text; try { localStorage.setItem('gw-spiel-info', JSON.stringify(s)); } catch (e) {} }
  };

  const MEDAL = {
    gold: ['#c9a04a', '#7a5a1e', '<path d="M13 2 L5 14 H11 L9 22 L19 9 H13 Z" fill="#5a3608"/>'],
    teal: ['#6fd394', '#1f6b3a', '<path d="M12 22 V10" stroke="#0e3a1e" stroke-width="2"/><path d="M12 11 C7 11 5 7 5 3 C10 3 12 7 12 11 Z M12 15 C17 15 19 11 19 7 C14 7 12 11 12 15 Z" fill="#0e3a1e"/>'],
    pink: ['#e2475a', '#6e1622', '<path d="M4 3 C4 10 8 14 12 14 C16 14 20 10 20 3 C18 8 15 11 12 11 C9 11 6 8 4 3 Z" fill="#3a0a12"/><path d="M12 14 L10 18 L13 19 L11 22" stroke="#3a0a12" stroke-width="1.8" fill="none"/>']
  };
  function eventText(e) {
    const n = who(e.god), vn = e.village && VBYID[e.village] ? VBYID[e.village].name : '';
    if (e.action === 'join') return n + (e.god === ME ? ' trittst' : ' tritt') + ' als ' + GOD_LONG[e.god] + ' an.';
    if (e.action === 'regen') return n + ': Regen über ' + vn + ', +' + e.amount + ' Gläubige';
    if (e.action === 'prophet') return n + ': Prophet in ' + vn + ', +' + e.amount + ' Gläubige';
    if (e.action === 'blitz') return e.target_god ? n + ': Blitz auf ' + vn + ', ' + (e.target_god === ME ? 'du verlierst ' : who(e.target_god) + ' verliert ') + -e.amount : n + ': Blitz auf ' + vn + ', +' + e.amount + ' aus Furcht';
    return '';
  }
  function ago(ts) {
    const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
    if (s < 60) return 'gerade'; if (s < 3600) return Math.floor(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' Std'; return Math.floor(s / 86400) + ' T';
  }
  function chronicle(list) {
    if (!list.length) return '<div class="chron"><div>Noch ist nichts geschehen.</div></div>';
    return '<div class="chron">' + list.map(e => '<div><i style="background:' + CSSC[e.god] + '"></i><span>' + eventText(e) + '</span><time>' + ago(e.created_at) + '</time></div>').join('') + '</div>';
  }

  function applyPlayers(st) {
    GODS.forEach(k => delete PLAYERS[k]); (st.players || []).forEach(p => PLAYERS[p.god] = p.name);
    ME = st.me.god;
    const m = MEDAL[ME], medal = document.getElementById('medal');
    medal.style.background = 'radial-gradient(circle at 40% 35%, ' + m[0] + ', ' + m[1] + ' 70%)';
    medal.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24">' + m[2] + '</svg>';
    document.getElementById('god-name').textContent = GOD_LONG[ME];
    GODS.forEach(k => godObjs[k].label.el.innerHTML = '<i style="background:' + CSSC[k] + '"></i>' + (k === ME ? 'Du' : PLAYERS[k] ? esc(PLAYERS[k]) : 'frei') + ' · ' + GOD[k]);
  }
  function applyVillages(st, quiet) {
    (st.villages || []).forEach(sv => { const v = VBYID[sv.id]; if (!v) return; GODS.concat('neutral').forEach(k => v.bel[k] = sv[k]); afterChange(v, quiet); });
    paintTerritories();
  }
  // Übernimmt einen Spielstand vom Server. Fremde Wunder werden erst abgespielt, dann sichtbar.
  function applyState(st) {
    game.latest = st; game.events = st.events || [];
    applyPlayers(st);
    setFaith(st.me.faith); faithNext = st.me.next_in;
    const fresh = game.events.filter(e => e.id > game.lastEvent);
    game.lastEvent = game.events.reduce((m, e) => Math.max(m, e.id), game.lastEvent);
    if (!game.started) { applyVillages(st, true); return; }
    const foreign = fresh.filter(e => !e.mine);
    let wait = 0;
    foreign.forEach(e => {
      toast(plain(eventText(e)));
      const v = VBYID[e.village], a = ACTIONS[e.action];
      if (!v || !a) return;
      wait = Math.max(wait, e.action === 'prophet' ? 8.2 : 1.7);
      a.play(v, e.god, () => showAmount(v, e));
    });
    if (wait) setTimeout(() => applyVillages(game.latest), wait * 1000); else applyVillages(st);
  }
  let refreshing = null;
  function refresh() {
    if (!game.token || refreshing) return refreshing;
    const tok = game.token;
    refreshing = rpc('get_state', { p_token: tok }).then(st => { if (!game.pending && game.token === tok) applyState(st); }).catch(() => {}).finally(() => { refreshing = null; });
    return refreshing;
  }
  function connectLive() {
    if (game.live || !game.code || !window.supabase) return;
    try {
      const client = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
      game.live = client.channel('spiel-' + game.code).on('broadcast', { event: 'event' }, () => refresh()).subscribe();
    } catch (e) { game.live = null; }
  }
  const sbjs = document.getElementById('sbjs'); if (sbjs) sbjs.addEventListener('load', connectLive);
  setInterval(() => { if (!document.hidden) refresh(); }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (!game.token) return;
    if (document.hidden) rpc('mark_seen', { p_token: game.token }, true).catch(() => {}); else refresh();
  });

  async function startGame(code, token) {
    const st = await rpc('get_state', { p_token: token });
    game.code = st.code; game.token = token; game.started = false; game.lastEvent = 0;
    if (game.live) { try { game.live.unsubscribe(); } catch (e) {} game.live = null; }
    saved.put(game.code, token); saved.putInfo(game.code, st.me.name + ' als ' + GOD_LONG[st.me.god] + ', ' + st.players.length + ' Spieler');
    if (selected) deselect();
    try { const u = new URL(location.href); u.searchParams.set('spiel', game.code); history.replaceState(null, '', u); } catch (e) {}
    applyState(st); game.started = true;
    lobby.el.hidden = true; sheet.hidden = true; dock.hidden = false;
    connectLive();
    const missed = game.events.filter(e => !e.mine && new Date(e.created_at) > new Date(st.me.seen_at));
    if (missed.length) openSheet('<div class="card-head"><div><h2 id="card-title">Seit deinem letzten Besuch</h2><p>Das haben die anderen Götter getan.</p></div><button class="x" id="card-close" aria-label="Schließen">' + ICON.close + '</button></div>' + chronicle(missed.reverse()));
    else setTimeout(() => toast('Tippe ein Dorf an, um ein Wunder zu wirken.'), 800);
    rpc('mark_seen', { p_token: token }).catch(() => {});
  }
  async function invite() {
    const url = location.href.split('#')[0], text = 'Tritt meinem Götterwettstreit bei! Spielcode: ' + game.code;
    try { if (navigator.share) { await navigator.share({ title: 'Götterwettstreit', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + '\n' + url); toast('Einladung kopiert.'); } catch (e) { toast('Spielcode: ' + game.code); }
  }

  // ---------- Beitrittsbildschirm ----------
  const lobby = { el: document.getElementById('lobby'), mode: 'create', code: null, god: null, taken: {} };
  const lb = id => document.getElementById(id);
  function renderGods() {
    lb('lobby-gods').innerHTML = GODS.map(k => '<button type="button" class="gpick" data-god="' + k + '" aria-pressed="' + (lobby.god === k) + '"' + (lobby.taken[k] ? ' disabled' : '') + '><i style="background:' + CSSC[k] + '"></i>' + GOD_LONG[k] + (lobby.taken[k] ? '<small>' + esc(lobby.taken[k]) + '</small>' : '') + '</button>').join('');
    lb('lobby-gods').querySelectorAll('.gpick').forEach(b => b.addEventListener('click', () => { lobby.god = b.dataset.god; sfx.tap(); renderGods(); }));
  }
  async function showLobby(mode, code) {
    lobby.mode = mode; lobby.code = code || null; lobby.taken = {}; lb('lobby-err').textContent = '';
    lb('lobby-sub').textContent = mode === 'join' ? 'Spiel ' + code + ' · wähle deinen Gott' : 'Ein neues Spiel für dich und deine Freunde';
    lb('lobby-go').textContent = mode === 'join' ? 'Beitreten' : 'Spiel erstellen';
    lb('lobby-alt').hidden = mode === 'join'; lb('lobby-new').hidden = mode !== 'join';
    lobby.el.hidden = false; sheet.hidden = true; dock.hidden = true;
    lb('lobby-back').hidden = !game.token;
    const mine = Object.keys(saved.all()).filter(c => c !== game.code), info = saved.info();
    lb('lobby-games').hidden = !mine.length;
    lb('lobby-games').innerHTML = mine.length ? '<span class="mytitle">Deine anderen Spiele auf diesem Gerät</span>' + mine.map(c => '<button type="button" class="gpick" data-code="' + esc(c) + '"><b>' + esc(c) + '</b><small>' + esc(info[c] || '') + '</small></button>').join('') : '';
    lb('lobby-games').querySelectorAll('[data-code]').forEach(b => b.addEventListener('click', () => { const c = b.dataset.code; sfx.tap(); startGame(c, saved.all()[c]).catch(err => { lb('lobby-err').textContent = err.message; }); }));
    if (mode === 'join') {
      try {
        const info = await rpc('game_lobby', { p_code: code });
        if (!info) { showLobby('create'); lb('lobby-err').textContent = 'Spiel ' + code + ' gibt es nicht.'; return; }
        info.players.forEach(p => lobby.taken[p.god] = p.name);
        if (GODS.every(k => lobby.taken[k])) lb('lobby-err').textContent = 'Alle drei Götter sind schon vergeben.';
      } catch (e) { lb('lobby-err').textContent = e.message; }
    }
    if (!lobby.god || lobby.taken[lobby.god]) lobby.god = GODS.find(k => !lobby.taken[k]) || null;
    renderGods();
  }
  // Bewusst kein <form>-Submit: eingebettete Vorschauen sperren Formulare oft stillschweigend.
  lb('lobby-name').addEventListener('keydown', e => { if (e.key === 'Enter') lb('lobby-go').click(); });
  lb('lobby-go').addEventListener('click', async () => {
    ac();
    const name = lb('lobby-name').value.trim();
    if (!name) { lb('lobby-err').textContent = 'Wie sollen dich die Sterblichen nennen?'; return; }
    if (!lobby.god) { lb('lobby-err').textContent = 'Wähle einen freien Gott.'; return; }
    lb('lobby-go').disabled = true; lb('lobby-err').textContent = '';
    try {
      const r = lobby.mode === 'join' ? await rpc('join_game', { p_code: lobby.code, p_name: name, p_god: lobby.god }) : await rpc('create_game', { p_name: name, p_god: lobby.god });
      try { localStorage.setItem('gw-name', name); } catch (err) {}
      await startGame(r.code, r.token); sfx.fanfare();
      if (lobby.mode === 'create') setTimeout(() => toast('Lade deine Freunde unter „Götter“ ein. Spielcode: ' + r.code, true), 600);
    } catch (err) { lb('lobby-err').textContent = err.message; if (lobby.mode === 'join') showLobby('join', lobby.code); }
    finally { lb('lobby-go').disabled = false; }
  });
  lb('lobby-codebtn').addEventListener('click', () => { const c = lb('lobby-code').value.trim().toUpperCase(); if (c.length !== 5) { lb('lobby-err').textContent = 'Der Code hat fünf Zeichen.'; return; } const t = saved.all()[c]; if (t) startGame(c, t).catch(() => showLobby('join', c)); else showLobby('join', c); });
  lb('lobby-new').addEventListener('click', () => showLobby('create'));
  lb('lobby-back').addEventListener('click', () => { lobby.el.hidden = true; dock.hidden = false; });
  try { lb('lobby-name').value = localStorage.getItem('gw-name') || ''; } catch (e) {}
  lb('lobby-build').textContent = BUILD;

  (async function boot() {
    let code = null; try { code = (new URLSearchParams(location.search).get('spiel') || '').toUpperCase() || null; } catch (e) {}
    const all = saved.all();
    if (!code) code = saved.last();
    if (code && all[code]) {
      try { await startGame(code, all[code]); return; }
      catch (e) { if (/Unbekannter Spieler/.test(e.message)) saved.put(code, null); else { toast(e.message); } }
    }
    const urlCode = (() => { try { return new URLSearchParams(location.search).get('spiel'); } catch (e) { return null; } })();
    if (urlCode) showLobby('join', urlCode.toUpperCase()); else showLobby('create');
  })();
})();
